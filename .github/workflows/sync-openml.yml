name: Sync All CSVs to OpenML

on:
  push:
    branches:
      - main
    paths:
      - '**.csv' # Tự động kích hoạt khi có bất kỳ tệp CSV nào được thêm mới hoặc chỉnh sửa trên nhánh main

jobs:
  sync-to-openml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openml

      - name: Run Multi-CSV OpenML Sync Script
        env:
          OPENML_API_KEY: ${{ secrets.OPENML_API_KEY }}
        run: python scripts/sync_openml.py
